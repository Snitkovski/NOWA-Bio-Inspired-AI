role_id: procurement
display_name: Procurement Manager
mcp_capabilities:
- &id001
  tool_id: mcp__1c__get_stock_levels
  server_name: 1c_erp
  display_name: Get stock levels
  description: READ stock
  risk_level: read_only
  domain_tags:
  - procurement
  requires_approval: false
- &id002
  tool_id: mcp__1c__get_suppliers
  server_name: 1c_erp
  display_name: Get suppliers
  description: READ suppliers
  risk_level: read_only
  domain_tags:
  - procurement
  requires_approval: false
- &id003
  tool_id: mcp__1c__get_budget
  server_name: 1c_erp
  display_name: Get budget
  description: READ budget
  risk_level: read_only
  domain_tags:
  - finance
  requires_approval: false
- &id004
  tool_id: mcp__1c__create_purchase_order
  server_name: 1c_erp
  display_name: Create purchase order
  description: WRITE purchase order
  risk_level: medium_write
  domain_tags:
  - procurement
  requires_approval: true
  input_schema:
    type: object
    required:
    - supplier_id
    - sku
    - qty
    properties:
      supplier_id:
        type: string
      sku:
        type: string
      qty:
        type: number
affective_mapping:
  stock_critical_low:
    valence: -0.7
    arousal: 0.8
    tags:
    - procurement
    - urgency
    - risk
  supplier_defaulted:
    valence: -0.5
    arousal: 0.6
    tags:
    - procurement
    - risk
  deal_closed_favorable:
    valence: 0.8
    arousal: 0.6
    tags:
    - procurement
    - success
  budget_exceeded:
    valence: -0.8
    arousal: 0.7
    tags:
    - finance
    - risk
mcp_servers:
- server_id: 1c_erp
  display_name: 1C ERP
  transport: mock
  enabled: true
  command: ''
  args: []
  url: ''
  tools:
  - *id001
  - *id002
  - *id003
  - *id004
action_vocabulary: {}
field_aliases: {}
param_bindings: {}
seed_corpus:
- context_tokens:
  - event:stock_critical_low
  - domain:procurement
  - valence:very_negative
  - arousal:high
  action: mcp__1c__create_purchase_order
  consequence: stock_restored
  reward: 0.8
  intensity: 0.9
  reinforce: true
- context_tokens:
  - event:stock_critical_low
  - domain:procurement
  - budget:critical
  action: mcp__1c__create_purchase_order
  consequence: budget_preserved
  reward: 0.6
  intensity: 0.7
  reinforce: false
- context_tokens:
  - event:supplier_defaulted
  - domain:procurement
  - valence:negative
  action: mcp__1c__create_purchase_order
  consequence: risk_reduced
  reward: 0.7
  intensity: 0.8
  reinforce: true
- context_tokens:
  - event:order_arrived_on_time
  - domain:trust
  - valence:positive
  action: mcp__1c__create_purchase_order
  consequence: reliable_delivery
  reward: 0.5
  intensity: 0.5
  reinforce: false
- context_tokens:
  - event:quiet_day
  - domain:neutral
  - valence:neutral
  action: wait_and_monitor
  consequence: no_action_needed
  reward: 0.1
  intensity: 0.2
  reinforce: false
- context_tokens:
  - event:demand_shock
  - domain:procurement
  - arousal:high
  - valence:negative
  action: mcp__1c__create_purchase_order
  consequence: demand_met
  reward: 0.75
  intensity: 0.85
  reinforce: true
- context_tokens:
  - budget:high_utilization
  - domain:finance
  - valence:negative
  action: wait_and_monitor
  consequence: budget_protected
  reward: 0.4
  intensity: 0.6
  reinforce: false
- context_tokens:
  - event:order_arrived_late
  - domain:risk
  - valence:negative
  action: mcp__1c__create_purchase_order
  consequence: supplier_risk_reduced
  reward: 0.6
  intensity: 0.7
  reinforce: true
