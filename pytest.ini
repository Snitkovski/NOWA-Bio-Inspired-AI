[pytest]
# Several demos ship a test_integration.py. importlib mode keeps those
# modules distinct when the suite is collected from the repository root.
addopts = --import-mode=importlib
norecursedirs =
    .git
    .venv
    .venv312
    .pytest_cache
    .nuitka_cache
    build_nuitka
    pytest_tmp_env
    .pytest_tmp*
    .tmp_pytest*
